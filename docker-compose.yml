services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: engirag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-engirag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engirag_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-engirag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engirag} -d ${POSTGRES_DB:-engirag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
